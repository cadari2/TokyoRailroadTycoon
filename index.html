<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tokyo Railroad Tycoon — 1872–2028</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- top toolbar: brand plate + icon buttons (RCT-style) -->
  <div id="topbar">
    <div id="brand"><i class="ico ico-loco"></i><span id="title">TOKYO RAILROAD TYCOON</span></div>
    <div class="tgroup">
      <button id="pauseBtn" class="tbtn" title="Pause / resume the simulation"><i class="ico ico-pause"></i><span class="tl">Pause</span></button>
      <button id="debugBtn" class="tbtn" style="display:none" title="Skip the simulation ahead to a chosen year"><i class="ico ico-clock"></i><span class="tl">Debug</span></button>
    </div>
    <div class="tgroup">
      <button id="demandBtn" class="tbtn" title="Toggle the demand heatmap — where riders are, even before any track exists"><i class="ico ico-demand"></i><span class="tl">Demand</span></button>
      <button id="ownersBtn" class="tbtn" title="Toggle the land-ownership overlay"><i class="ico ico-owners"></i><span class="tl">Land</span></button>
    </div>
    <span class="spacer"></span>
    <div class="tgroup">
      <button id="audioBtn" class="tbtn" title="Mute / unmute game audio"><i class="ico ico-audio"></i></button>
      <button id="menuBtn" class="tbtn" title="Show or hide the side window"><i class="ico ico-menu"></i><span class="tl">Menu</span></button>
    </div>
  </div>
  <div id="main">
    <div id="mapWrap">
      <canvas id="map"></canvas>
      <div id="ticker" title="Latest from the event log — click to open the full log"></div>
    </div>
    <div id="sidebar">
      <div id="sideTitle"><span class="swatch"></span><span class="stitle">Tokyo Railroad Co.</span></div>
      <div id="tabs"></div>
      <div id="panel"></div>
    </div>
  </div>
  <!-- bottom bar: cash LED | status line | riders | date LED -->
  <div id="bottombar">
    <span id="cash" class="lcd money"></span>
    <span id="statusbar"></span>
    <span id="pax" class="lcd dimlcd"></span>
    <span id="pop" class="lcd dimlcd" title="Total living population of Greater Tokyo across the whole map"></span>
    <span id="clock" class="lcd"></span>
  </div>
  <div id="modal" class="hidden"><div id="modalBox"></div></div>
  <div id="startScreen"><div id="startBox"></div></div>

  <!-- load order matters: config → util → data → map → world → sim → hr →
       ai → events → save → render → art → ui → main -->
  <script src="assets/audio/manifest.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="data/i18n.js"></script>
  <script src="data/machinames.js"></script>
  <script src="data/londonnames.js"></script>
  <script src="data/nycnames.js"></script>
  <script src="data/melbnames.js"></script>
  <script src="data/parisnames.js"></script>
  <script src="data/hexnames.js"></script>
  <script src="js/map.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/hr.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/events.js"></script>
  <script src="js/rd.js"></script>
  <script src="js/save.js"></script>
  <script src="js/render.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
